<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
<title id="title">Friendly cleaning robot</title>
<desc id="desc">Original blue and ivory comic style cleaning robot with domed head, friendly eyes, utility arms, tank tracks, and a floor brush.</desc>
<defs>
