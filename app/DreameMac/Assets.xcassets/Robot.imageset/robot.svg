  <linearGradient id="body" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5f5e9"/><stop offset="1" stop-color="#bac8c4"/></linearGradient>
  <pattern id="grip" width="18" height="26" patternUnits="userSpaceOnUse"><path d="M3 8h12M3 19h12" stroke="#597580" stroke-width="4" stroke-linecap="round"/></pattern>
</defs>
<!-- ground / soft graphical shadow -->
<ellipse cx="300" cy="706" rx="218" ry="25" fill="#183447" opacity=".12"/>
